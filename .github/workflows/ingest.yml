name: Ingest season data

on:
  schedule:
    # Every 6 hours (UTC). NOTE: `schedule` only fires once this file exists on
    # the repo's DEFAULT branch — it never runs from other branches, and GitHub
    # auto-disables crons after 60 days without repo activity (re-enable in the
    # Actions tab if that happens).
    - cron: '0 */6 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read # least privilege — the job only reads the repo

concurrency:
  group: ingest # never let two ingestion runs upsert concurrently
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ingestion/package-lock.json

      - name: Install dependencies
        working-directory: ingestion
        run: npm ci

      # Gate every run behind the unit tests + fixture-based dry run.
      # Both need zero secrets, so a broken mapper can never hit Supabase.
      - name: Run tests (includes --dry-run validation)
        working-directory: ingestion
        run: npm test

      # The manami anime-offline-database releases weekly (~tens of MB); cache
      # the download per ISO week so we only pull it from GitHub once a week.
      - name: Compute ISO week cache key
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache manami anime-offline-database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ingestion/.cache
          key: manami-db-${{ steps.week.outputs.week }}

      - name: Run ingestion
        working-directory: ingestion
        env:
          # Required
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
          # Optional enrichment — absent secrets just skip that step (non-fatal)
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run ingest

      # ── Outros nomes (manami) ───────────────────────────────────────────
      # Os sinónimos do manami (o nome inglês, o romaji, traduções latinas) vão
      # para animes.alt_titles, que é onde a pesquisa procura "The Warrior
      # Princess and the Barbaric King" quando o título é "Himekishi wa
      # Barbaroi no Yome". Usa o manami que a cache acima já trouxe e só escreve
      # o que é novo. Sem a migração 20260928000000, sai sem fazer nada.
      # Quantas pessoas seguem cada uma das ~1 400 séries mais seguidas: é a
      # ordem do Top 10 da home (web/lib/data/top.ts). Ver
      # ingestion/src/popularity.js. Menos de um minuto; não trava a ingestão.
      - name: Refresh follower counts
        continue-on-error: true
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
        run: npm run popularity
      # Avisa o Bing (e quem lê o IndexNow) das páginas que esta corrida mudou:
      # episódios que saíram, episódios novos, séries novas. Ver
      # ingestion/src/indexnow.js. Não trava a ingestão se o serviço falhar.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run indexnow
      - name: Fill alternative titles
        continue-on-error: true
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run alt-titles

      # ── Videoclipes e PV ────────────────────────────────────────────────
      # Marca como `media_type = 'Music'` os videoclipes (o "Echo" que aparecia
      # ao pesquisar "Solo Leveling") e como 'PV' os PV, CM e trailers, para o
      # site não os mostrar como anime. Ver ingestion/src/extras.js. Idempotente:
      # só escreve o que muda, por isso a primeira corrida marca ~5 000 linhas e
      # as seguintes nada. Usa o manami da cache acima e a lista "Music" do
      # AnimeSchedule (guardada uma semana em .cache/). Não trava a ingestão.
      - name: Reclassify music videos and PVs
        continue-on-error: true
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
        run: npm run extras

      # ── Trailers ────────────────────────────────────────────────────────
      # O trailer de cada série no ar ou por estrear, do TVDB (prefere o
      # inglês, que é o da Crunchyroll). Ver ingestion/src/trailers.js. Não
      # fatal: a ficha tem o Kitsu e a pesquisa no YouTube como recurso.
      - name: Fill trailers
        continue-on-error: true
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: npm run trailers

      # ── Sinopses ────────────────────────────────────────────────────────
      #
      # Medido a 2026-08-21: 85 dos 28 784 titulos tinham sinopse (0,3%), e
      # 246 das 320 series NO AR nao tinham nenhuma. A sinopse e o corpo de
      # texto que o Google indexa; sem ela as fichas sao paginas quase vazias.
      #
      # Nao era falta de fonte: 93% das fichas varridas na AnimeSchedule tem
      # uma. Era a varredura nunca conseguir acabar. Sao ~1080 paginas e uma
      # corrida bate no limite de rajada a meio, DEPOIS de o cliente ja ter
      # tentado quatro vezes com backoff.
      #
      # Agora cada corrida faz um pedaco e a seguinte continua. A 100 paginas
      # de 6 em 6 horas, o catalogo enche-se em cerca de tres dias, e a partir
      # dai o passo passa a apanhar so o que e novo.

      # A marca do progresso vive em `.cache/`, mas NAO pode ir na mesma cache
      # do manami: aquela tem chave semanal e o `actions/cache` so grava se a
      # chave ainda nao existir, portanto a marca ficaria congelada na primeira
      # corrida da semana. Chave por corrida, com `restore-keys` a apanhar a
      # mais recente.
      - name: Restore synopsis sweep checkpoint
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ingestion/.cache/catalogue-sweep.json
          key: nimu-sweep-${{ github.run_id }}
          restore-keys: nimu-sweep-

      # Nao fatal: um 429 aqui nao pode derrubar a ingestao do calendario, que
      # e a parte que as pessoas veem todos os dias.
      - name: Fill missing synopses
        continue-on-error: true
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANIMESCHEDULE_TOKEN: ${{ secrets.ANIMESCHEDULE_TOKEN }}
        run: npm run descriptions -- --paginas 100

      # `always()`: a marca tem de sobreviver mesmo quando o passo acima falha
      # a meio, senao o proximo comeca outra vez do principio e nunca avanca.
      - name: Save synopsis sweep checkpoint
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ingestion/.cache/catalogue-sweep.json
          key: nimu-sweep-${{ github.run_id }}
