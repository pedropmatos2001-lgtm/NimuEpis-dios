# Mantém o site acordado (2026-11-11, aprovado pelo dono).
#
# No plano gratuito da Vercel, o servidor que constrói as páginas adormece
# quando ninguém o usa durante uns minutos, e a primeira visita a seguir
# espera ~1,5 s a mais só para ele acordar (medido em produção). Este trabalho
# visita as páginas principais de 5 em 5 minutos, em português e em inglês,
# para que quem chega encontre o servidor já acordado.
#
# Só lê páginas públicas (sem sessão, sem segredos). Nunca falha: um pedido que
# corra mal não interessa, o próximo corre daqui a 5 minutos.
#
# O GitHub pode atrasar ou saltar corridas agendadas quando está carregado, e
# desliga os agendamentos ao fim de 60 dias sem atividade no repositório.
name: Aquecer o site

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: aquecer
  cancel-in-progress: true

permissions: {}

jobs:
  aquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar as páginas principais
        run: |
          for p in / /pt /discover /pt/discover /temporadas /pt/temporadas /noticias /pt/noticias /watchlist /pt/watchlist; do
            curl -s -o /dev/null --max-time 20 -A "nimu-aquecer" \
              -w "$p %{http_code} %{time_starttransfer}s\n" "https://nimuhome.com$p" || true
          done
